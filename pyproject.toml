[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "untrust"
version = "1.0.0"
description = "A TEE deployment auditor for the trust boundaries that attestation forgets."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sandeep Jayashankar" },
]
requires-python = ">=3.10"
keywords = [
    "tee",
    "enclave",
    "nitro",
    "sev-snp",
    "tdx",
    "confidential-computing",
    "cloud-security",
    "aws",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/pyro-0x/untrust"
Repository = "https://github.com/pyro-0x/untrust"
Issues = "https://github.com/pyro-0x/untrust/issues"

[project.scripts]
untrust = "untrust.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["untrust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
